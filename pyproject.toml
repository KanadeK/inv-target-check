[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inv-target-check"
version = "0.1.0"
description = "Offline validation of Sphinx inventory targets against a built documentation tree"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
inv-target-check = "inv_target_check.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/inv-target-check"
Issues = "https://github.com/KanadeK/inv-target-check/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
